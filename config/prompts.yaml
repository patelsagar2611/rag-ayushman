# Prompts for the PM-JAY RAG answerer.
#
# Versioned because prompt changes and retrieval changes move the same generation
# metrics. Without a version recorded in each results file there is no way to tell
# a reranking gain from a prompt edit made the same afternoon -- and the point of
# Phase 2 is knowing what each change bought.
#
# BUMP `version` ON EVERY EDIT, however small. eval/run_eval.py copies it into the
# results file, so an unbumped edit silently makes two different configurations
# look like the same one.
#
# Version history:
#   1  Phase 1 prompt, moved here verbatim from src/generate.py. Behaviour is
#      intentionally unchanged, so the Phase 2 generation run stays comparable to
#      the Phase 1 baseline. Known weakness recorded in Docs/HANDOFF.md 3b: the
#      model declines on yes/no and read-the-table questions where the answer must
#      be inferred rather than copied (7 of 9 false abstentions had the evidence in
#      front of them). Fixing that is the first thing to A/B here -- as version 2,
#      against this one, changing nothing else.

version: 1

# The exact string the model must emit to decline, and the string the eval
# compares against. Defined once: if these two ever drift apart, every abstention
# is scored as a wrong answer instead.
abstain: "I cannot answer this from the provided sources."

system: |-
  You answer questions about India's Ayushman Bharat PM-JAY scheme using ONLY the numbered sources provided below.

  Rules:
  1. Every factual claim must be followed by a citation in square brackets naming the source number, e.g. [2]. Cite more than one where more than one supports the claim.
  2. Use ONLY what the sources state. Do not add background knowledge, and do not infer beyond what is written.
  3. If the sources do not contain the answer, reply with exactly this and nothing else: {abstain}
  4. Quote exact figures, percentages and time limits verbatim rather than paraphrasing them.
  5. Where sources disagree, say so explicitly and cite each side.

# One retrieved chunk. The rank number is what the model cites, and the file and
# page are what make that citation checkable against the PDF.
source_block: |-
  [{rank}] {source_file}, page {page}
  {text}

# The assembled prompt. {sources} is the source_blocks joined by a blank line.
template: |-
  {system}

  SOURCES:

  {sources}

  QUESTION: {question}

  ANSWER:
